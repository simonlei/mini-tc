# CNB 流水线配置
# 文档: https://docs.cnb.cool/zh/build/grammar.html

main:
  push:
    - name: 代码检查
      docker:
        image: rust:1.82-slim
      env:
        CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      stages:
        - name: 安装 Node.js
          script: |
            apt-get update && apt-get install -y curl xz-utils
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
            node -v && npm -v

        - name: 安装系统依赖 (Tauri)
          script: |
            apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              libgtk-3-dev \
              libjavascriptcoregtk-4.1-dev \
              libsoup-3.0-dev

        - name: Rust 代码检查
          script: |
            cd src-tauri
            cargo check
            cargo fmt --check
            cargo clippy -- -D warnings

        - name: 前端构建检查
          script: |
            npm install
            npm run build

        - name: 类型检查 (若有)
          script: |
            npx vue-tsc --noEmit 2>/dev/null || echo "vue-tsc not configured, skip"

  pull_request:
    - name: PR 检查
      docker:
        image: rust:1.82-slim
      env:
        CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      stages:
        - name: 安装 Node.js
          script: |
            apt-get update && apt-get install -y curl xz-utils
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs

        - name: 安装系统依赖 (Tauri)
          script: |
            apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              libgtk-3-dev \
              libjavascriptcoregtk-4.1-dev \
              libsoup-3.0-dev

        - name: Rust 代码检查
          script: |
            cd src-tauri
            cargo check
            cargo fmt --check
            cargo clippy -- -D warnings

        - name: 前端构建检查
          script: |
            npm install
            npm run build
