[package]
name = "mini-tc"
version = "0.1.0"
description = "A lightweight cross-platform file manager"
authors = ["MiniTC"]
edition = "2021"

[lib]
name = "mini_tc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
