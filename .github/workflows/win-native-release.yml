# Release pipeline for the native Windows build (win-native/).
#
# Kept separate from release.yml on purpose: that workflow still builds the
# Tauri app for macOS and must stay untouched. Tags are namespaced `win-v*`
# so the two channels never collide.
name: Release (Windows native)

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0'
        required: true
      self_contained:
        description: 'Bundle the .NET runtime (larger installer, no prerequisites)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            # refs/tags/win-v0.2.0 -> 0.2.0
            $version = '${{ github.ref_name }}' -replace '^win-v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unexpected version '$version' (want X.Y.Z)"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building MiniTC $version"

      - name: Restore
        working-directory: win-native
        run: dotnet restore

      - name: Test
        working-directory: win-native
        run: dotnet test tests/MiniTC.Tests/MiniTC.Tests.csproj --nologo -v minimal

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Build release
        working-directory: win-native
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SELF_CONTAINED: ${{ inputs.self_contained }}
        run: |
          # Hashtable splatting: an array splat binds values positionally, so
          # the literal '-Version' would be passed as the Version value.
          # $args is also a reserved automatic variable, hence $buildArgs.
          $buildArgs = @{ Version = $env:RELEASE_VERSION }
          if ($env:RELEASE_SELF_CONTAINED -eq 'true') { $buildArgs.SelfContained = $true }
          ./scripts/build-release.ps1 @buildArgs

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "win-v$version"
          $files = Get-ChildItem win-native/artifacts/releases -File | ForEach-Object { $_.FullName }

          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title "MiniTC (Windows) $version" --generate-notes
          }

          gh release upload $tag $files --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: minitc-win-${{ steps.version.outputs.version }}
          path: win-native/artifacts/releases/*

  # Publishes the Velopack feed next to the Tauri one, under the win-native/
  # prefix that UpdateService.DefaultFeedUrl points at.
  sync-cos:
    needs: build
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && needs.build.result == 'success' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: minitc-win-*
          merge-multiple: true
          path: feed

      - name: Sync to Tencent COS
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          # AWS CLI >= 2.22 (botocore >= 1.36) adds CRC32 request checksums as
          # *trailing headers* in aws-chunked encoding. Each UploadPart then
          # carries no Content-Length, and COS answers MissingContentLength.
          # Only the 11 MB Setup.exe crosses the 8 MB multipart threshold, which
          # is why the small feed files upload fine and this one fails.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "${COS_BUCKET:-}" ]; then
            echo "COS secrets not configured; skipping feed publish."
            exit 0
          fi

          aws --version

          aws configure set aws_access_key_id "$COS_SECRET_ID"
          aws configure set aws_secret_access_key "$COS_SECRET_KEY"
          aws configure set region "$COS_REGION"
          # COS rejects path-style addressing on this bucket, and AWS CLI v2's
          # chunked payload signing omits Content-Length, which COS requires.
          aws configure set s3.addressing_style virtual
          aws configure set s3.payload_signing_enabled false
          # Keep multipart uploads small so a failed part costs little to retry.
          aws configure set default.s3.multipart_chunksize 8MB
          aws configure set s3.max_concurrent_requests 2
          aws configure set default.retry_mode standard
          aws configure set default.max_attempts 8

          EP="https://cos.$COS_REGION.myqcloud.com"

          for i in 1 2 3 4 5; do
            if aws s3 sync feed "s3://$COS_BUCKET/win-native" --endpoint-url "$EP"; then
              echo "Feed synced on attempt $i."
              exit 0
            fi
            echo "Attempt $i failed; retrying in $((i * i * 5))s."
            sleep $((i * i * 5))
          done

          echo "ERROR: feed sync failed."
          exit 1
