name: Release

# 构建 MiniTC 发布版本：三平台安装包 + Tauri 更新器签名 (latest.json)。
#
# 触发：
#   1. 推送 v* 标签 → 自动构建并发布 Release
#   2. Actions 页面手动运行 (workflow_dispatch)，需指定 tag
#
# 必需的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          # src-tauri/keys/mini-tc.key 的文件内容（base64 字符串）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD # 生成密钥时设置的密码（生成脚本用 mini-tc-updater）
#
# 可选（macOS 代码签名/公证；不配置则 ad-hoc 签名，产物可用但触发 Gatekeeper 提示）：
#   配置后需在下方 env 加回：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#                       以及：APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   注：更新器签名与 Apple 签名相互独立，不配 Apple 证书不影响应用内自动更新。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust_target || 'host' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 更新器签名：生成各平台 .sig 并聚合为 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名/公证：未配置 Apple 证书时必须完全省略 APPLE_* 变量，
          # 否则 tauri-action 会尝试导入空证书而失败（failed to import keychain certificate）。
          # 当前走 ad-hoc 签名（产物可用但触发 Gatekeeper 提示；更新器签名仍由上方密钥生成）。
          # 将来配置 Apple 证书后，在下方加回：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # 规避 rustc 1.97.1 ICE（与 dev.sh 保持一致）
          CARGO_INCREMENTAL: '0'
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MiniTC ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
