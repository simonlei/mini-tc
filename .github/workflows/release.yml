name: Release

# 构建 MiniTC 发布版本：Windows + macOS 安装包 + Tauri 更新器签名 (latest.json)。
#
# 触发：
#   1. 推送 v* 标签 → 自动构建并发布 Release
#   2. Actions 页面手动运行 (workflow_dispatch)，需指定 tag
#
# 必需的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          # src-tauri/keys/mini-tc.key 的文件内容（base64 字符串）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD # 生成密钥时设置的密码（生成脚本用 mini-tc-updater）
#
#  更新通道（S3 兼容对象存储 / Supabase Storage）：把 latest.json 与各平台更新包
#  同步到公开 bucket，供应用内自动更新下载。沿用原有的 secret 名，不新增条目，
#  换 S3 后只需在 GitHub 后台把这几个值改成新存储的值：
#   COS_BUCKET        # bucket 名称，填 minitc（必须设为 public，否则公开 URL 无法访问）
#   COS_REGION        # 项目 region，从 Supabase Storage → S3 配置页复制，例如 ap-southeast-1
#   COS_SECRET_ID     # Supabase 生成的 S3 access key id
#   COS_SECRET_KEY    # 对应的 secret access key
#   UPDATER_CDN_BASE  # 更新通道公开根地址，必须填
#                     # https://fynancufrubtbyykddsx.supabase.co/storage/v1/object/public/minitc
#                     # （须与 tauri.conf.json 的 plugins.updater.endpoints 前缀一致；
#                     #  下方 job 会校验，仍留旧 COS 地址会直接报错）
#  注：S3 兼容 API 地址按 Supabase 固定格式写死在 sync-s3 job 内，不需要额外 secret。
#
# 可选（macOS 代码签名/公证；不配置则 ad-hoc 签名，产物可用但触发 Gatekeeper 提示）：
#   配置后需在下方 env 加回：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#                       以及：APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   注：更新器签名与 Apple 签名相互独立，不配 Apple 证书不影响应用内自动更新。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust_target || 'host' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump version from tag
        # 根据发布标签注入版本号到 package.json / Cargo.toml / tauri.conf.json，
        # 使 latest.json 的 version 字段与标签一致，更新器才能正确判断版本。
        # 仅在 CI 构建时改写，不回写 git，源码版本号保持滞后无妨。
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node scripts/bump_version.js "$VERSION"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 更新器签名：生成各平台 .sig 并聚合为 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名/公证：未配置 Apple 证书时必须完全省略 APPLE_* 变量，
          # 否则 tauri-action 会尝试导入空证书而失败（failed to import keychain certificate）。
          # 当前走 ad-hoc 签名（产物可用但触发 Gatekeeper 提示；更新器签名仍由上方密钥生成）。
          # 将来配置 Apple 证书后，在下方加回：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MiniTC ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Upload portable Windows binary
        # 额外上传可直接运行的裸 exe（免安装版），与 NSIS 安装器并存于同一 Release。
        # 便携版前端已嵌入二进制，单文件即可运行；但依赖系统 WebView2 运行时，
        # 且不参与应用内自动更新（仅 NSIS 安装版走更新器通道）。
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC="src-tauri/target/release/mini-tc.exe"
          ASSET="MiniTC_${VERSION}_x64_portable.exe"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: portable binary not found at $SRC"
            exit 1
          fi
          cp "$SRC" "$ASSET"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded portable binary: $ASSET"

  # 所有平台更新通道同步到 S3：等 release 矩阵（Win/mac）全部完成后，
  # 从 GitHub Release 按 latest.json 实际引用拉取更新包，改写全部平台 URL 为
  # 公开访问地址，再用 aws s3 cli 上传（Windows/macOS 走同一通道）。
  # gh、jq、AWS CLI v2 为 ubuntu-22.04 runner 预装，无需额外安装。
  sync-s3:
    needs: release
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    # 单次 PutObject 可能陷入长重传；不设超时会一直烧到 GitHub 默认的 360 分钟。
    timeout-minutes: 30
    env:
      # 与 tauri.conf.json 的 plugins.updater.endpoints 前缀保持一致；
      # 同时作为 UPDATER_CDN_BASE 的校验基准，防止旧 COS 地址残留。
      UPDATER_PUBLIC_BASE: https://fynancufrubtbyykddsx.supabase.co/storage/v1/object/public/minitc
    steps:
      - name: Download release assets from GitHub
        # 按 latest.json 实际引用的文件名逐个下载，而非写死后缀。
        # 原因：createUpdaterArtifacts:true 时 Tauri 2.x 是「直接对安装器签名」，
        # 产物是 .exe/.msi/.app.tar.gz/.AppImage 等本体 + .sig，并不生成
        # *.nsis.zip / *.wix.zip（旧假设会导致 gh release download 匹配为空而失败）。
        # 只信清单引用，即可兼容当前形态与将来若改出 zip 打包形态。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p updater-assets && cd updater-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "latest.json"
          mapfile -t ASSETS < <(jq -r '.platforms[].url | split("/") | .[-1]' latest.json | awk '!s[$0]++')
          for f in "${ASSETS[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f"
            echo "downloaded: $f"
          done

      - name: Rewrite latest.json → public S3 URLs (all platforms)
        # 用 jq 把每个 platform 的 URL 改写为 <UPDATER_CDN_BASE>/<filename>，
        # 其余字段（signature 等）保持不变。jq 与 python3 均为 runner 预装，
        # 这里选 jq 内联，避免为这一步单独维护 Python 脚本。
        env:
          UPDATER_CDN_BASE: ${{ secrets.UPDATER_CDN_BASE }}
        run: |
          # secret 里若还留着旧 COS 地址，改写出的清单会指向失效的桶，直接失败更省事。
          if [ "${UPDATER_CDN_BASE%/}" != "$UPDATER_PUBLIC_BASE" ]; then
            echo "ERROR: secret UPDATER_CDN_BASE 必须设为 $UPDATER_PUBLIC_BASE（当前: ${UPDATER_CDN_BASE:-<空>}）"
            exit 1
          fi
          cd updater-assets
          jq --arg base "${UPDATER_CDN_BASE%/}" \
             '.platforms |= map_values(.url = ($base + "/" + (.url | split("/") | .[-1])))' \
             latest.json > .tmp && mv .tmp latest.json
          echo "Rewrote latest.json URLs to $UPDATER_CDN_BASE"

      - name: Sync updater artifacts to S3
        timeout-minutes: 20
        # runner 预装 AWS CLI v2，直接用 aws s3 对接 Supabase Storage 的 S3 兼容接口。
        # Supabase 的 S3 endpoint 为 https://<project-ref>.storage.supabase.co/storage/v1/s3，
        # 且只支持 path-style（bucket 拼在 endpoint 路径后）：默认的 virtual-hosted-style
        # 会把 bucket 拼成子域名，DNS 解析不到而失败。
        # 关闭 aws-chunked 流式签名与默认校验和：Supabase 的 PutObject 不支持
        # x-amz-checksum-* / STREAMING-UNSIGNED-PAYLOAD-TRAILER 头。
        # bucket 需设为 public；不要加 --acl public-read（Supabase 不支持 x-amz-acl）。
        # 源目录必须带尾斜杠（updater-assets/），否则对象会落到 updater-assets/ 前缀下，
        # 和 latest.json 里的 <UPDATER_CDN_BASE>/<filename> 对不上。
        # 先传安装包、最后传 latest.json，避免更新器读到清单时安装包还没传完。
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          : "${COS_REGION:?Missing secret COS_REGION}"
          : "${COS_SECRET_ID:?Missing secret COS_SECRET_ID}"
          : "${COS_SECRET_KEY:?Missing secret COS_SECRET_KEY}"
          BUCKET="${COS_BUCKET:-minitc}"
          # Supabase 的 S3 endpoint 由 project ref 决定、与 region 无关，直接写死；
          # 换别家 S3 时改这一行即可，不额外引入 secret。
          EP="https://fynancufrubtbyykddsx.storage.supabase.co/storage/v1/s3"
          aws configure set aws_access_key_id "$COS_SECRET_ID"
          aws configure set aws_secret_access_key "$COS_SECRET_KEY"
          aws configure set region "$COS_REGION"
          aws configure set s3.addressing_style path
          aws configure set s3.payload_signing_enabled false
          aws configure set default.retry_mode standard
          aws configure set default.max_attempts 8
          aws --version

          # s3 sync 按大小/ETag 跳过已传文件，重试只补传失败项。
          MAX_RETRIES=3
          for i in $(seq 1 "$MAX_RETRIES"); do
            if aws s3 sync updater-assets/ "s3://${BUCKET}/" \
                 --endpoint-url "$EP" --exclude "latest.json" \
               && aws s3 cp updater-assets/latest.json "s3://${BUCKET}/latest.json" \
                 --endpoint-url "$EP"; then
              echo "Sync succeeded on attempt $i."
              break
            fi
            echo "Sync attempt $i failed."
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: sync failed after $MAX_RETRIES attempts."
              exit 1
            fi
            SLEEP=$((i * i * 5))
            echo "Retrying in ${SLEEP}s..."
            sleep "$SLEEP"
          done
          echo "Synced all-platform updater artifacts to S3: $UPDATER_PUBLIC_BASE"
