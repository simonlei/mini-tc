name: Release

# 构建 MiniTC 发布版本：Windows + macOS 安装包 + Tauri 更新器签名 (latest.json)。
#
# 触发：
#   1. 推送 v* 标签 → 自动构建并发布 Release
#   2. Actions 页面手动运行 (workflow_dispatch)，需指定 tag
#
# 必需的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          # src-tauri/keys/mini-tc.key 的文件内容（base64 字符串）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD # 生成密钥时设置的密码（生成脚本用 mini-tc-updater）
#
#  国内镜像（腾讯云 COS）：将 Windows 更新通道（latest.json + NSIS 更新包）双推到 COS，供国内用户走 CDN 更新。
#   UPDATER_CDN_BASE  # 更新通道根地址，例如 https://minitc-125xxxx.cos.ap-guangzhou.myqcloud.com
#                      （须与 tauri.conf.json 的 plugins.updater.endpoints 前缀一致）
#   COS_BUCKET        # COS bucket 名称
#   COS_REGION        # COS 地域，例如 ap-guangzhou
#   COS_SECRET_ID     # 腾讯云 API 密钥 ID
#   COS_SECRET_KEY    # 腾讯云 API 密钥 Key
#
# 可选（macOS 代码签名/公证；不配置则 ad-hoc 签名，产物可用但触发 Gatekeeper 提示）：
#   配置后需在下方 env 加回：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#                       以及：APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   注：更新器签名与 Apple 签名相互独立，不配 Apple 证书不影响应用内自动更新。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust_target || 'host' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump version from tag
        # 根据发布标签注入版本号到 package.json / Cargo.toml / tauri.conf.json，
        # 使 latest.json 的 version 字段与标签一致，更新器才能正确判断版本。
        # 仅在 CI 构建时改写，不回写 git，源码版本号保持滞后无妨。
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node scripts/bump_version.js "$VERSION"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 更新器签名：生成各平台 .sig 并聚合为 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名/公证：未配置 Apple 证书时必须完全省略 APPLE_* 变量，
          # 否则 tauri-action 会尝试导入空证书而失败（failed to import keychain certificate）。
          # 当前走 ad-hoc 签名（产物可用但触发 Gatekeeper 提示；更新器签名仍由上方密钥生成）。
          # 将来配置 Apple 证书后，在下方加回：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # 规避 rustc 1.97.1 ICE（与 dev.sh 保持一致）
          CARGO_INCREMENTAL: '0'
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MiniTC ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Upload portable Windows binary
        # 额外上传可直接运行的裸 exe（免安装版），与 NSIS 安装器并存于同一 Release。
        # 便携版前端已嵌入二进制，单文件即可运行；但依赖系统 WebView2 运行时，
        # 且不参与应用内自动更新（仅 NSIS 安装版走更新器通道）。
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC="src-tauri/target/release/mini-tc.exe"
          ASSET="MiniTC_${VERSION}_x64_portable.exe"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: portable binary not found at $SRC"
            exit 1
          fi
          cp "$SRC" "$ASSET"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded portable binary: $ASSET"

  # 所有平台更新通道双推到腾讯云 COS：等 release 矩阵（Win/mac）全部完成后，
  # 从 GitHub Release 按 latest.json 实际引用拉取更新包，改写全部平台 URL 为 COS，
  # 再整体上传，使国内用户（无论 Windows/macOS）均走 CDN 更新。
  # 依赖均为 ubuntu-22.04 runner 预装：gh、jq、aws（CLI v2），无需 pip/额外安装。
  sync-cos:
    needs: release
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets from GitHub
        # 按 latest.json 实际引用的文件名逐个下载，而非写死后缀。
        # 原因：createUpdaterArtifacts:true 时 Tauri 2.x 是「直接对安装器签名」，
        # 产物是 .exe/.msi/.app.tar.gz/.AppImage 等本体 + .sig，并不生成
        # *.nsis.zip / *.wix.zip（旧假设会导致 gh release download 匹配为空而失败）。
        # 只信清单引用，即可兼容当前形态与将来若改出 zip 打包形态。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p cos-assets && cd cos-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "latest.json"
          mapfile -t ASSETS < <(jq -r '.platforms[].url | split("/") | .[-1]' latest.json | awk '!s[$0]++')
          for f in "${ASSETS[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f"
            echo "downloaded: $f"
          done

      - name: Rewrite latest.json → COS CDN (all platforms)
        # 用 jq 把每个 platform 的 URL 改写为 <UPDATER_CDN_BASE>/<filename>，
        # 其余字段（signature 等）保持不变。jq 与 python3 均为 runner 预装，
        # 这里选 jq 内联，避免为这一步单独维护 Python 脚本。
        env:
          UPDATER_CDN_BASE: ${{ secrets.UPDATER_CDN_BASE }}
        run: |
          cd cos-assets
          jq --arg base "${UPDATER_CDN_BASE%/}" \
             '.platforms |= map_values(.url = ($base + "/" + (.url | split("/") | .[-1])))' \
             latest.json > .tmp && mv .tmp latest.json
          echo "Rewrote latest.json URLs to $UPDATER_CDN_BASE"

      - name: Sync updater artifacts to Tencent COS
        # runner 预装 AWS CLI v2，直接用 aws s3 sync 对接腾讯云 COS（S3 兼容），
        # 无需 pip 安装。
        # 寻址方式必须用 virtual-hosted-style：COS 对该 bucket 禁用 path-style
        # （否则报 PathStyleDomainForbidden），请求会落到
        # https://<bucket>.cos.<region>.myqcloud.com/...。
        # 关闭 payload 签名：AWS CLI v2 对分片上传默认用 aws-chunked 流式签名，
        # 不带 Content-Length 头，COS 严格要求该头会报 MissingContentLength。
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          UPDATER_CDN_BASE: ${{ secrets.UPDATER_CDN_BASE }}
        run: |
          aws configure set aws_access_key_id "$COS_SECRET_ID"
          aws configure set aws_secret_access_key "$COS_SECRET_KEY"
          aws configure set region "$COS_REGION"
          aws configure set s3.addressing_style virtual
          aws configure set s3.payload_signing_enabled false
          # GH Actions runner(美西)→ 腾讯云 COS(国内)跨太平洋链路慢，
          # 更新产物仅 4 个左右且 <8MB（走单次 PutObject，不触发 multipart 分片）。
          # 并发降到 2 让单个上传拿到更多带宽；再套 shell 重试兜 COS 专有的
          # UserNetworkTooSlow（非标准码，CLI standard 重试不一定兜得住）。
          # s3 sync 按大小/etag 跳过已传文件，重试只补传失败项。
          aws configure set s3.max_concurrent_requests 2
          aws configure set default.retry_mode standard
          aws configure set default.max_attempts 8
          EP="https://cos.$COS_REGION.myqcloud.com"
          MAX_RETRIES=5
          for i in $(seq 1 "$MAX_RETRIES"); do
            if aws s3 sync cos-assets "s3://$COS_BUCKET" --endpoint-url "$EP"; then
              echo "Sync succeeded on attempt $i."
              break
            fi
            echo "Sync attempt $i failed."
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: sync failed after $MAX_RETRIES attempts."
              exit 1
            fi
            SLEEP=$((i * i * 5))   # 5/20/45/80s 退避
            echo "Retrying in ${SLEEP}s..."
            sleep "$SLEEP"
          done
          echo "Synced all-platform updater artifacts to COS: $UPDATER_CDN_BASE"
